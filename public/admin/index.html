<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Laureles — Admin</title>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
    <script src="image-grid-widget.js?v=3"></script>
    <script>
      (function () {
        var MAX_BYTES = 1024 * 1024;

        function rejectLarge(file) {
          if (!file || typeof file.size !== "number" || file.size <= MAX_BYTES) return false;
          window.alert(
            "La imagen pesa " +
              (file.size / (1024 * 1024)).toFixed(2) +
              " MB. El maximo es 1 MB.\nComprimila en https://squoosh.app e intenta de nuevo."
          );
          return true;
        }

        document.addEventListener(
          "change",
          function (event) {
            var input = event.target;
            if (!input || input.type !== "file" || !input.files) return;
            for (var i = 0; i < input.files.length; i++) {
              if (rejectLarge(input.files[i])) {
                input.value = "";
                event.stopImmediatePropagation();
                event.preventDefault();
                return;
              }
            }
          },
          true
        );

        document.addEventListener(
          "drop",
          function (event) {
            var dt = event.dataTransfer;
            if (!dt || !dt.files) return;
            for (var i = 0; i < dt.files.length; i++) {
              var file = dt.files[i];
              if (file.type && file.type.indexOf("image/") === 0 && rejectLarge(file)) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return;
              }
            }
          },
          true
        );

        var configUrl = new URL("config.yml?v=20261020h", window.location.href).toString();

        fetch(configUrl, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("No se pudo cargar config.yml (" + res.status + ")");
            return res.text();
          })
          .then(function (raw) {
            var config = jsyaml.load(raw) || {};
            config.load_config_file = false;
            delete config.media_library;
            window.CMS.init({ config: config });
          })
          .catch(function (err) {
            document.body.innerHTML =
              "<pre style='padding:24px;font-family:sans-serif;color:#b00020'>" +
              "Error cargando el admin:\n" +
              String(err && err.message ? err.message : err) +
              "</pre>";
            console.error(err);
          });
      })();
    </script>
  </body>
</html>
