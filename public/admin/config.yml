backend:
  name: github
  repo: ivanabraz/laureles
  branch: main
  base_url: https://laureles-cms-oauth.braz-ivana.workers.dev

local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: family
        label: Family
        file: src/data/family.json
        media_folder: public/images/portfolio/family
        public_folder: /images/portfolio/family
        fields:
          - name: images
            label: Imagenes
            widget: list
            summary: "{{fields.src}} — {{fields.style}}"
            fields:
              - { label: Imagen, name: src, widget: image }
              - label: Estilo
                name: style
                widget: select
                options:
                  - { label: Studio, value: studio }
                  - { label: Outdoor, value: outdoor }
                default: studio

      - name: brands
        label: Brands
        file: src/data/brands.json
        media_folder: public/images/portfolio/brands
        public_folder: /images/portfolio/brands
        fields:
          - name: images
            label: Imagenes
            widget: list
            summary: "{{fields.text}} — {{fields.style}}"
            fields:
              - { label: Imagen, name: src, widget: image }
              - label: Estilo
                name: style
                widget: select
                options:
                  - { label: Studio, value: studio }
                  - { label: Outdoor, value: outdoor }
                default: studio
              - { label: Nombre (pastilla), name: text, widget: string, required: false }
              - { label: Link, name: href, widget: string, required: false }

      - name: shelters
        label: Shelters
        file: src/data/shelter.json
        media_folder: public/images/portfolio/shelters
        public_folder: /images/portfolio/shelters
        fields:
          - name: images
            label: Imagenes
            widget: list
            summary: "{{fields.src}} — {{fields.style}}"
            fields:
              - { label: Imagen, name: src, widget: image }
              - label: Estilo
                name: style
                widget: select
                options:
                  - { label: Studio, value: studio }
                  - { label: Outdoor, value: outdoor }
                default: studio
              - { label: Nombre (pastilla), name: text, widget: string, required: false }
              - { label: Link, name: href, widget: string, required: false }

      - name: specials
        label: Specials
        file: src/data/specials.json
        media_folder: public/images/portfolio/specials
        public_folder: /images/portfolio/specials
        fields:
          - name: images
            label: Imagenes
            widget: list
            summary: "{{fields.src}} — {{fields.style}}"
            fields:
              - { label: Imagen, name: src, widget: image }
              - label: Estilo
                name: style
                widget: select
                options:
                  - { label: Studio, value: studio }
                  - { label: Outdoor, value: outdoor }
                default: studio

  - name: site_packages
    label: Paquetes
    files:
      - name: packages_data
        label: Paquetes
        file: src/data/packages.json
        media_folder: public/images/packages
        public_folder: /images/packages
        fields:
          - name: packages
            label: Paquetes
            widget: list
            summary: "{{fields.id}}"
            fields:
              - label: Paquete
                name: id
                widget: select
                options:
                  - { label: Chihuahua, value: chihuahua }
                  - { label: Galgo, value: galgo }
                  - { label: Akita, value: akita }
                  - { label: Pug, value: pug }
                  - { label: Mestizo, value: mestizo }
                  - { label: Dogo, value: dogo }
                  - { label: Gift card, value: gift_card }
              - { label: Imagen de la card, name: cover, widget: image }
              - name: gallery
                label: Galeria del modal
                widget: list
                field: { label: Imagen, name: image, widget: image }
              - label: Color del titulo
                name: titleColor
                widget: select
                options:
                  - { label: Negro, value: text-black }
                  - { label: Blanco, value: text-white }
                default: text-white
