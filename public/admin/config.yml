backend:
  name: github
  repo: ivanabraz/laureles
  branch: main
  base_url: https://laureles-cms-oauth.braz-ivana.workers.dev

local_backend: true

site_url: https://laureles.netlify.app
display_url: https://laureles.netlify.app

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: portfolio
    label: Portfolio
    editor:
      preview: false
    files:
      - name: portfolio_all
        label: Todas las fotos
        file: src/data/portfolio.json
        media_folder: public/images/portfolio
        public_folder: /images/portfolio
        fields:
          - name: images
            label: Portfolio
            widget: image-grid
            unified: true
            media_folder: public/images/portfolio
            public_folder: /images/portfolio
            hint: Todas juntas. Filtrá arriba. Click = categoría, Estudio/Exterior y pastilla.

  - name: site_packages
    label: Paquetes
    editor:
      preview: false
    files:
      - name: packages_data
        label: Imagenes de paquetes
        file: src/data/packages.json
        media_folder: public/images/packages
        public_folder: /images/packages
        fields:
          - name: packages
            label: Paquetes
            widget: packages-grid
            media_folder: public/images/packages
            public_folder: /images/packages
            hint: Cards visuales. Click = cover + galeria del modal. Textos en el Sheet.
