backend:
  name: github
  repo: ivanabraz/laureles
  branch: main
  base_url: https://laureles-cms-oauth.braz-ivana.workers.dev

local_backend: true

site_url: https://laureles.netlify.app
display_url: https://laureles.netlify.app

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: portfolio
    label: Portfolio
    editor:
      preview: false
    files:
      - name: portfolio_all
        label: Todas las fotos
        file: src/data/portfolio.json
        media_folder: public/images/portfolio
        public_folder: /images/portfolio
        fields:
          - name: images
            label: Portfolio
            widget: image-grid
            unified: true
            media_folder: public/images/portfolio
            public_folder: /images/portfolio
            hint: Todas juntas. Filtrá arriba. Click = categoría, Estudio/Exterior y pastilla.

  - name: site_packages
    label: Paquetes
    editor:
      preview: false
    files:
      - name: packages_data
        label: Imagenes de paquetes
        file: src/data/packages.json
        media_folder: public/images/packages
        public_folder: /images/packages
        fields:
          - name: packages
            label: Paquetes
            label_singular: paquete
            widget: list
            summary: "{{fields.id}}"
            hint: Textos del paquete se editan en el Google Sheet, aca solo fotos.
            fields:
              - label: Cual paquete
                name: id
                widget: select
                options:
                  - { label: Chihuahua, value: chihuahua }
                  - { label: Galgo, value: galgo }
                  - { label: Akita, value: akita }
                  - { label: Pug, value: pug }
                  - { label: Mestizo, value: mestizo }
                  - { label: Dogo, value: dogo }
                  - { label: Gift card, value: gift_card }
              - label: Foto de la card
                name: cover
                widget: image
                hint: Maximo 1 MB
              - name: gallery
                label: Galeria del modal
                widget: image-grid
                paths_only: true
                media_folder: public/images/packages
                public_folder: /images/packages
                hint: Fotos del modal — grilla con drag y borrar. Max 1 MB.
              - label: Color del titulo en la card
                name: titleColor
                widget: select
                options:
                  - { label: Negro, value: text-black }
                  - { label: Blanco, value: text-white }
                default: text-white
